<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="page-head" style="overflow:hidden;">
        <a href="index.html"><h1><br>家乡介绍：广东（点击回到首页）<br><br></h1></a>
    </div>
    
    <hr>
    
    <h2 data-reveal="left">5.奇妙特色</h2>
    <div class="video-row" data-reveal>
        <div class="video-item">
            <video data-reveal src="video/🆘 战 螂 🆘.mp4" controls width="300"></video>
        </div>
        <div class="video-item">
            <video data-reveal src="video/终于知道为啥电视里没有广东的霸总了，那画面不忍直视啊！.mp4" controls width="800"></video>
        </div>
    </div>
    <script>
    (function () {
        var d = document.documentElement;
        d.classList.add('js-ready');

        function setup() {
            var items = Array.prototype.slice.call(document.querySelectorAll('[data-reveal]'));

            if (!('IntersectionObserver' in window)) {
                items.forEach(function (el) { el.classList.add('is-in'); });
                return;
            }

            var io = new IntersectionObserver(function (entries) {
                entries.forEach(function (entry) {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-in');
                        io.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.08, rootMargin: '0px 0px -8% 0px' });

            items.forEach(function (el) { io.observe(el); });
        }

        // 顶部阅读进度条
        function progress() {
            var bar = document.createElement('div');
            bar.className = 'read-progress';
            bar.setAttribute('aria-hidden', 'true');
            document.body.appendChild(bar);

            var ticking = false;

            function update() {
                ticking = false;
                var doc = document.documentElement;
                var max = doc.scrollHeight - window.innerHeight;
                var p = max > 0 ? Math.min(1, Math.max(0, window.pageYOffset / max)) : 0;
                bar.style.setProperty('--p', p.toFixed(4));
            }

            function onScroll() {
                if (!ticking) {
                    ticking = true;
                    window.requestAnimationFrame(update);
                }
            }

            window.addEventListener('scroll', onScroll, { passive: true });
            window.addEventListener('resize', onScroll);
            update();
        }

        function boot() {
            setup();
            progress();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', boot);
        } else {
            boot();
        }
    })();
    </script>
</body>
</html>
